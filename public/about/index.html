<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WANG Can Frank · About Me</title>
  <meta name="description" content="Contact, CV, and research paper for WANG Can Frank.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --ink: #17242e;
      --muted: #4b5e6b;
      --accent: #24587d;
      --wash: #edf4f8;
      --line: #dae5ec;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 2rem 1rem clamp(4rem, 12vh, 8rem);
      background: #fff;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 38rem);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.1rem, 8.4vw, 4.375rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .32em;
      text-indent: .32em;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .25rem;
      margin: clamp(2rem, 7vw, 3.25rem) 0 0;
      padding: .875rem 0 0;
      border-top: 1px solid var(--line);
    }

    .entry {
      display: grid;
      justify-items: center;
      gap: .55rem;
      padding: .55rem .125rem;
      border-radius: .75rem;
      color: var(--ink);
      font-size: clamp(.75rem, 2vw, .875rem);
      font-weight: 600;
      text-decoration: none;
    }

    .icon {
      display: grid;
      width: clamp(2.875rem, 11vw, 4rem);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: var(--wash);
      color: var(--accent);
    }

    .entry:hover .icon, .entry:focus-visible .icon {
      background: var(--accent);
      color: #fff;
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .icon svg, .close svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    dialog {
      width: min(calc(100% - 2rem), 23rem);
      max-height: calc(100% - 2rem);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: #fff;
      color: var(--ink);
      text-align: center;
      box-shadow: 0 1.5rem 4rem #17242e25;
    }

    dialog:not([open]) { display: none; }
    dialog::backdrop { background: #17242e66; }

    .dialog-body {
      position: relative;
      padding: 1.5rem 1.25rem;
    }

    .close {
      position: absolute;
      top: .625rem;
      right: .625rem;
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--wash);
      color: var(--ink);
      cursor: pointer;
    }

    .close:hover { background: var(--line); }

    .dialog-body h2 {
      margin: 0;
      font-size: 1.125rem;
    }

    .qr {
      display: block;
      width: min(100%, 17rem);
      height: auto;
      margin: .5rem auto 0;
    }

    .qr-instructions {
      margin: 0 auto .875rem;
      max-width: 27ch;
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.5;
    }

    .download {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0 .5rem;
      color: var(--accent);
      font-size: .875rem;
      font-weight: 650;
      text-underline-offset: .2em;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>WANG Can Frank</h1>
      <p class="subtitle">ABOUT ME</p>
    </header>
    <nav class="links" aria-label="About me links">
      <a class="entry" id="wechat-link" href="wechat-qr.png">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M14.7 6.9A7 7 0 0 0 8.5 3C4.9 3 2 5.5 2 8.6c0 1.6.8 3 2.1 4l-.6 2.5 2.8-1.4c.7.2 1.4.3 2.2.3"/>
            <path d="M22 13.7c0-2.8-2.6-5.1-5.8-5.1s-5.8 2.3-5.8 5.1 2.6 5.1 5.8 5.1c.6 0 1.2-.1 1.8-.2l2.6 1.4-.6-2.5c1.2-.9 2-2.3 2-3.8Z"/>
            <path d="M6.4 7.7h.1m3.6 0h.1m4.1 5.4h.1m3.5 0h.1" stroke-width="2.2"/>
          </svg>
        </span>
        <span>WeChat</span>
      </a>
      <a class="entry" href="https://healgney.github.io/cv.pdf">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4.5" width="18" height="15" rx="2"/>
            <circle cx="8.5" cy="10" r="1.6"/>
            <path d="M5.8 15.8a2.7 2.7 0 0 1 5.4 0m3-6h3.6m-3.6 4h3.6"/>
          </svg>
        </span>
        <span>CV</span>
      </a>
      <a class="entry" href="https://arxiv.org/abs/2607.25962">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm8 0v4h4M8.5 12h6m-6 3.5h6"/>
          </svg>
        </span>
        <span>Paper</span>
      </a>
      <a class="entry" href="mailto:frank4real.wang@connect.polyu.hk">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5.5" width="18" height="13" rx="2"/>
            <path d="m4 7 8 6 8-6"/>
          </svg>
        </span>
        <span>Email</span>
      </a>
    </nav>
  </main>

  <dialog id="wechat-dialog" aria-labelledby="wechat-title" aria-describedby="wechat-instructions">
    <div class="dialog-body">
      <form method="dialog">
        <button class="close" type="submit" aria-label="Close WeChat QR code" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </form>
      <h2 id="wechat-title">WeChat</h2>
      <img class="qr" src="wechat-qr.png" width="740" height="740" alt="WANG Can Frank’s WeChat QR code">
      <p class="qr-instructions" id="wechat-instructions">Press and hold in WeChat to scan, or save the image and open it in WeChat’s scanner.</p>
      <a class="download" href="wechat-qr.png" download>Save QR image</a>
    </div>
  </dialog>

  <script>
    const wechatLink = document.querySelector('#wechat-link');
    const wechatDialog = document.querySelector('#wechat-dialog');

    if (typeof wechatDialog.showModal === 'function') {
      wechatLink.setAttribute('aria-haspopup', 'dialog');
      wechatLink.addEventListener('click', (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        wechatDialog.showModal();
      });
      wechatDialog.addEventListener('click', (event) => {
        if (event.target === wechatDialog) wechatDialog.close();
      });
      wechatDialog.addEventListener('close', () => wechatLink.focus());
    }
  </script>
</body>
</html>
